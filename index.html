<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Controle de Estoque - Rose Gold</title>
    
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f472b6">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass-card { background: rgba(24, 24, 27, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(244, 114, 182, 0.25); }
        .rose-gradient { background: linear-gradient(135deg, #f472b6 0%, #fb7185 50%, #d4af37 100%); }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col pb-10">

    <!-- TELA DE LOGIN POR PIN -->
    <div id="telaLogin" class="fixed inset-0 z-50 bg-zinc-950 flex flex-col items-center justify-center p-4">
        <div class="glass-card w-full max-w-xs p-6 rounded-3xl text-center space-y-4 border-pink-500/40 shadow-xl shadow-pink-500/10">
            <div class="w-12 h-12 mx-auto rounded-2xl rose-gradient flex items-center justify-center text-zinc-950 text-xl shadow-lg shadow-pink-500/30 font-bold">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
            </div>
            <h2 class="text-lg font-bold bg-gradient-to-r from-pink-300 via-rose-300 to-amber-200 bg-clip-text text-transparent">Acesso Restrito</h2>
            <p class="text-xs text-zinc-400">Digite a senha de 4 dígitos</p>
            <input type="password" id="pinInput" maxlength="4" placeholder="••••" class="w-full text-center text-2xl tracking-widest bg-zinc-900 border border-pink-500/30 rounded-xl py-3 focus:outline-none focus:border-pink-500 text-pink-300 font-bold">
            <button type="button" onclick="validarPin()" class="w-full bg-pink-600 active:bg-pink-700 text-white font-semibold py-3 rounded-xl text-xs shadow-lg shadow-pink-600/30">Entrar</button>
        </div>
    </div>

    <!-- HEADER -->
    <header class="glass-card sticky top-0 z-40 px-4 py-3 flex items-center justify-between border-b border-pink-500/20">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl rose-gradient flex items-center justify-center text-zinc-950 font-bold shadow-lg shadow-pink-500/25">
                <i class="fa-solid fa-gem"></i>
            </div>
            <div>
                <h1 class="font-bold text-base bg-gradient-to-r from-pink-300 via-rose-300 to-amber-200 bg-clip-text text-transparent">Controle de Estoque</h1>
                <p class="text-[10px] text-zinc-400">Nuvem Sincronizada <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 ml-1 animate-pulse"></span></p>
            </div>
        </div>
        <button type="button" onclick="abrirVendaRapida()" class="bg-pink-600 active:bg-pink-700 text-white px-3.5 py-2 rounded-xl text-xs font-semibold flex items-center space-x-1.5 shadow-lg shadow-pink-600/30">
            <i class="fa-solid fa-cash-register"></i>
            <span>Venda Rápida</span>
        </button>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 space-y-5">

        <!-- DASHBOARD MÉTRICAS -->
        <div class="grid grid-cols-2 sm:grid-cols-5 gap-3">
            <div onclick="limparFiltros()" class="glass-card p-3.5 rounded-2xl cursor-pointer hover:border-pink-400 transition-colors">
                <p class="text-[10px] text-zinc-400 font-medium">Total Produtos</p>
                <h3 id="statTotalProdutos" class="text-lg font-bold mt-1 text-zinc-100">0</h3>
            </div>
            <div onclick="filtrarEstoqueBaixo()" class="glass-card p-3.5 rounded-2xl border-rose-500/40 cursor-pointer hover:bg-rose-950/20 transition-all">
                <p class="text-[10px] text-rose-400 font-medium flex items-center justify-between">
                    <span>Estoque Baixo</span>
                    <i class="fa-solid fa-filter text-[10px]"></i>
                </p>
                <h3 id="statEstoqueBaixo" class="text-lg font-bold mt-1 text-rose-400">0</h3>
            </div>
            <div class="glass-card p-3.5 rounded-2xl border-emerald-500/30">
                <p class="text-[10px] text-emerald-400 font-medium">Vendas (Hoje)</p>
                <h3 id="statVendasHoje" class="text-sm font-bold mt-1 text-emerald-300">R$ 0,00</h3>
            </div>
            <div class="glass-card p-3.5 rounded-2xl border-pink-500/30">
                <p class="text-[10px] text-pink-400 font-medium">Vendas (Mês)</p>
                <h3 id="statVendasMes" class="text-sm font-bold mt-1 text-pink-300">R$ 0,00</h3>
